<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,Arial,sans-serif;-webkit-tap-highlight-color:transparent}
body{background:#B8BEC6;color:#111}
header{position:fixed;top:0;left:0;right:0;height:64px;background:#1E3A5F;color:#fff;display:flex;align-items:center;gap:10px;padding:0 12px;z-index:100}
header button{background:none;border:none;color:#fff;font-size:26px;padding:8px;cursor:pointer}
header h1{font-size:16px;line-height:1.1;flex:1;font-weight:900}
main{padding:78px 14px 30px;max-width:620px;margin:auto}
h2{font-size:32px;margin:6px 2px 14px}
.card{background:linear-gradient(180deg,#EDEFF1,#E2E5E9);border-radius:14px;padding:14px;display:flex;align-items:center;gap:14px;margin-bottom:12px;box-shadow:0 6px 14px rgba(30,58,95,.16);cursor:pointer;border:1px solid #C8CDD3;border-left:4px solid #1E3A5F}
.card b{font-size:18px;color:#1E3A5F;display:block}.card small{color:#5A636E}.card .arrow{margin-left:auto;font-size:22px;color:#7A838E}
.folder{width:78px;height:62px;flex-shrink:0;font-size:54px;line-height:1;text-align:center;filter:drop-shadow(0 6px 5px rgba(0,0,0,.3))}
.btn{width:100%;background:#1E3A5F;color:#fff;border:none;border-radius:12px;padding:14px;font-size:16px;font-weight:800;cursor:pointer;margin-top:10px}
.btn.green{background:#065A40}.btn.gold{background:#F7C957;color:#111}
.field{margin-top:12px}.field label{display:block;font-weight:800;font-size:14px;margin-bottom:6px}
.field input,.field textarea{width:100%;border:1px solid #AEB4BC;border-radius:12px;padding:13px;font-size:16px;outline:none;background:#fff}
.field textarea{min-height:260px;font-family:monospace;line-height:1.5}
.song{background:#D3D8DD;border:1px solid #AEB4BC;border-radius:12px;padding:16px;margin-bottom:10px;cursor:pointer}.song b{font-size:17px}.song small{color:#5A636E}
.top-actions{display:flex;gap:10px;margin-bottom:14px}.top-actions button{flex:1;background:#D3D8DD;border:1px solid #AEB4BC;border-radius:12px;padding:11px;font-weight:700;cursor:pointer;color:#1E3A5F}
.hidden{display:none!important}
.cifra-top{background:#D3D8DD;border:1px solid #AEB4BC;border-bottom:none;border-radius:16px 16px 0 0;padding:14px 16px 8px}.cifra-top b{font-size:21px;text-transform:uppercase}
.cifra-box{background:#1E3A5F;color:#fff;border-radius:0 0 16px 16px;padding:12px 10px 16px}
.cifra-box pre{white-space:pre-wrap;word-break:break-word;font-family:monospace;line-height:1.25;margin:0;font-size:16px}
.cifra-box .linha-cifra{color:#FFD966;font-weight:800}
.cifra-box .linha-letra{color:#fff}
.search-box{background:#D3D8DD;border:1px solid #AEB4BC;border-radius:12px;padding:10px;margin-bottom:14px}
.search-box input{width:100%;border:1px solid #AEB4BC;border-radius:10px;padding:12px;font-size:16px;background:#fff}
.scroll-box{background:#D3D8DD;border:1px solid #AEB4BC;border-radius:16px;padding:12px;margin-top:12px;display:flex;align-items:center;gap:8px}
.scroll-box .play{flex:1;height:44px;border-radius:22px;border:none;background:#065A40;color:#fff;font-weight:900;cursor:pointer}.scroll-box .sbtn{width:44px;height:44px;border-radius:50%;border:1px solid #AEB4BC;background:#fff;font-size:20px;font-weight:900;cursor:pointer}
nav{position:fixed;top:0;left:-300px;width:285px;height:100%;background:#065A40;color:#fff;z-index:200;transition:.28s;overflow-y:auto}nav.open{left:0}
nav .item{display:flex;gap:12px;width:100%;background:none;border:none;color:#fff;padding:14px 18px;font-size:16px;font-weight:600;cursor:pointer;text-align:left}
#overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:150}#overlay.show{display:block}
#msg{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:12px 18px;border-radius:20px;z-index:300;display:none;font-size:14px;font-weight:700;max-width:90%;text-align:center}
</style>

<body>
<header><button onclick="toggleMenu()">☰</button><h1>Cifra Flow<br><span style="font-size:11px;font-weight:600;opacity:.8">STUDIO PREMIUM • V325</span></h1><button onclick="abrirBuscaInternet()" title="Buscar na internet">🔍</button></header>
<div id="overlay" onclick="toggleMenu()"></div>
<nav id="menu">
<div style="background:#04402E;padding:14px 16px;display:flex;justify-content:space-between;align-items:center"><b style="font-size:19px">CIFRA FLOW</b><button onclick="toggleMenu()" style="background:#fff;color:#065A40;border:none;border-radius:20px;padding:7px 12px;font-weight:900">FECHAR</button></div>
<button class="item" onclick="ir('inicio')">🏠 Início</button>
<button class="item" onclick="abrirBuscaInternet()">🔍 Buscar na Internet</button>
<button class="item" onclick="ir('nova')">➕ Nova Cifra</button>
<button class="item" onclick="ir('importar')">📥 Importar / Colar</button>
<button class="item" onclick="alert('Para importar do Cifra Club: abra a cifra no Google > Compartilhar > Cifra Flow. Ela entra sozinha aqui!')">↗️ Como importar do Cifra Club</button>
</nav>
<main>
<!-- INICIO -->
<div id="tela-inicio">
<h2>Minhas Pastas</h2>
<div class="top-actions"><button onclick="abrirBuscaInternet()">🔍 Buscar na Internet</button><button onclick="ir('nova')">➕ Nova Cifra</button></div>
<div id="listaPastas"></div>
<div id="listaMusicas"></div>
</div>

<!-- BUSCA INTERNET -->
<div id="tela-busca" class="hidden">
<h2>🔍 Buscar na Internet</h2>
<p style="color:#5A636E;font-size:14px;margin-bottom:10px">Busca direto no Cifra Club, igual no vídeo. Tocou, já baixa.</p>
<div class="search-box"><input id="buscaInput" placeholder="Ex: Legião Urbana, Alcione..." onkeydown="if(event.key==='Enter') buscarInternet()"><button class="btn green" onclick="buscarInternet()">PROCURAR</button></div>
<div id="resultBusca"></div>
<button class="btn" onclick="ir('inicio')">← VOLTAR</button>
</div>

<!-- NOVA / EDITAR -->
<div id="tela-nova" class="hidden">
<h2 id="tituloNova">Nova Cifra</h2>
<div class="field"><label>Artista / Pasta</label><input id="fArtista" placeholder="Ex: Legião Urbana"></div>
<div class="field"><label>Música</label><input id="fMusica" placeholder="Ex: Aloha"></div>
<div class="field"><label>Cifra</label><textarea id="fTexto" placeholder="Cole a cifra aqui..."></textarea></div>
<button class="btn green" onclick="salvar()">💾 SALVAR</button>
<button class="btn" onclick="ir('inicio')">CANCELAR</button>
</div>

<!-- VER CIFRA -->
<div id="tela-ver" class="hidden">
<div class="cifra-top"><b id="vTitulo"></b><small id="vArtista"></small></div>
<div class="cifra-box"><div id="vTexto"></div></div>
<div class="scroll-box"><button class="sbtn" onclick="mudarVel(-1)">-</button><button class="play" id="btnPlay" onclick="togglePlay()">▶ ROLAR</button><button class="sbtn" onclick="mudarVel(1)">+</button><span id="vVel" style="font-weight:900;min-width:60px;text-align:center">Vel 0<br>Parado</span></div>
<div style="display:flex;gap:10px"><button class="btn gold" onclick="telaCheia()">⛶ TELA CHEIA</button><button class="btn" onclick="ir('inicio')">← VOLTAR</button></div>
</div>

<!-- TELA CHEIA -->
<div id="tela-cheia" class="hidden">
<div style="background:#1E3A5F;color:#fff;padding:18px 14px 80px;min-height:100vh" id="cheiaTexto"></div>
<button onclick="sairCheia()" style="position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#C0392B;color:#fff;border:none;padding:14px 28px;border-radius:30px;font-weight:900">✕ SAIR DA TELA CHEIA</button>
</div>
</main>
<div id="msg"></div>
<script>
let musicas = JSON.parse(localStorage.getItem('cf_musicas')||'[]');
let atual=null, vel=0, rolando=false, timer=null;
function toast(t){let m=document.getElementById('msg');m.textContent=t;m.style.display='block';setTimeout(()=>m.style.display='none',2500)}
function toggleMenu(){document.getElementById('menu').classList.toggle('open');document.getElementById('overlay').classList.toggle('show')}
function ir(t){['tela-inicio','tela-busca','tela-nova','tela-ver','tela-cheia'].forEach(x=>document.getElementById(x).classList.add('hidden'));document.getElementById('tela-'+t).classList.remove('hidden');document.getElementById('menu').classList.remove('open');document.getElementById('overlay').classList.remove('show');window.scrollTo(0,0);if(t==='inicio')render()}
function abrirBuscaInternet(){ir('busca');setTimeout(()=>document.getElementById('buscaInput').focus(),100)}
function render(){
  let pastas={}; musicas.forEach(m=>{pastas[m.artista]=(pastas[m.artista]||0)+1});
  let html=''; Object.keys(pastas).forEach(p=>{html+=`<div class="card" onclick="abrirPasta('${p.replace(/'/g,"")}')"><div class="folder">📁</div><div><b>${p}</b><small>${pastas[p]} músicas</small></div><span class="arrow">›</span></div>`});
  if(!html) html='<p style="color:#5A636E">Nenhuma música ainda. Toca em <b>Buscar na Internet</b> e baixa a primeira!</p>';
  document.getElementById('listaPastas').innerHTML=html; document.getElementById('listaMusicas').innerHTML='';
}
function abrirPasta(p){let lista=musicas.filter(m=>m.artista===p);let h=`<h2>${p}</h2>`;lista.forEach((m,i)=>{let idx=musicas.indexOf(m);h+=`<div class="song" onclick="ver(${idx})"><b>${m.musica}</b><br><small>${m.artista}</small></div>`});h+=`<button class="btn" onclick="ir('inicio')">← VOLTAR</button>`;document.getElementById('listaPastas').innerHTML='';document.getElementById('listaMusicas').innerHTML=h}
function salvar(){let a=document.getElementById('fArtista').value.trim()||'Sem Artista';let mu=document.getElementById('fMusica').value.trim()||'Sem Título';let tx=document.getElementById('fTexto').value.trim();if(!tx){toast('Cole a cifra primeiro');return}musicas.push({artista:a,musica:mu,texto:tx});localStorage.setItem('cf_musicas',JSON.stringify(musicas));toast('Salva! ✅');ir('inicio')}
function formatar(txt){return txt.split('\n').map(l=>{let t=l.trim();if(!t) return '<div style="height:8px"></div>';let isCifra=/^[A-G][#b]?m?(\s+[A-G][#b]?m?.*)+$/.test(t)||/^(Intro|Tom:|Refrão|Verso|\[)/i.test(t);let cls=isCifra?'linha-cifra':'linha-letra';return `<div class="${cls}">${l.replace(/</g,'&lt;')}</div>`}).join('')}
function ver(i){atual=i;let m=musicas[i];document.getElementById('vTitulo').textContent=m.musica;document.getElementById('vArtista').textContent=m.artista;document.getElementById('vTexto').innerHTML=formatar(m.texto);ir('ver')}
function telaCheia(){document.getElementById('cheiaTexto').innerHTML='<h2>'+musicas[atual].musica+'</h2>'+formatar(musicas[atual].texto);ir('cheia')}
function sairCheia(){ir('ver')}
function mudarVel(d){vel=Math.max(0,Math.min(10,vel+d));document.getElementById('vVel').innerHTML=vel===0?'Vel 0<br>Parado':'Vel '+vel+(vel===1?' • Bem lenta':'');if(rolando){clearInterval(timer);if(vel>0) iniciarRolagem()}}
function togglePlay(){if(vel===0){vel=1;mudarVel(0)}rolando=!rolando;document.getElementById('btnPlay').textContent=rolando?'⏸ PAUSAR':'▶ ROLAR';if(rolando) iniciarRolagem();else clearInterval(timer)}
function iniciarRolagem(){clearInterval(timer);let speed=1100-vel*95;timer=setInterval(()=>{window.scrollBy(0,1);let el=document.getElementById('cheiaTexto');if(el) el.parentElement.scrollTop+=1},speed)}

// ===== BUSCA NA INTERNET - IGUAL DO VÍDEO =====
async function buscarInternet(){
  let q=document.getElementById('buscaInput').value.trim(); if(!q){toast('Digite artista ou música');return}
  document.getElementById('resultBusca').innerHTML='<p>Procurando na internet... 🔍</p>';
  try{
    // Usa proxy para ler a busca do Cifra Club sem bloqueio
    let url='https://www.cifraclub.com/?q='+encodeURIComponent(q);
    let prox='https://api.allorigins.win/raw?url='+encodeURIComponent(url);
    let r=await fetch(prox); let html=await r.text();
    let doc=new DOMParser().parseFromString(html,'text/html');
    let links=[...doc.querySelectorAll('a[href*="/cifras/"], a[href*="/alcione/"], a[href*="/legiao-urbana/"]')];
    // Fallback: qualquer link do cifraclub
    if(links.length<3) links=[...doc.querySelectorAll('a[href*="cifraclub.com"]')];
    let vistos=new Set(), achados=[];
    for(let a of links){let h=a.getAttribute('href');if(!h) continue;if(h.startsWith('/')) h='https://www.cifraclub.com'+h;if(!h.includes('cifraclub.com')) continue;if(h.endsWith('.com/')||h.includes('?q=')) continue;let titulo=a.textContent.trim();if(titulo.length<3||titulo.length>80) continue;if(vistos.has(h)) continue;vistos.add(h);achados.push({titulo,url:h});if(achados.length>=15) break}
    if(!achados.length) throw new Error('vazio');
    document.getElementById('resultBusca').innerHTML=achados.map((x,i)=>`<div class="song" onclick="baixarDaInternet(${i},'${x.url.replace(/'/g,'')}','${x.titulo.replace(/'/g,'').replace(/"/g,'')}')"><b>${x.titulo}</b><br><small>Cifra Club • Toque para baixar</small></div>`).join('');
    window._achados=achados;
  }catch(e){
    // Se o proxy falhar, abre a busca do Cifra Club e o usuário compartilha pra cá
    document.getElementById('resultBusca').innerHTML=`<p>Não consegui ler direto. Toca abaixo que abre no Google / Cifra Club, aí você toca em <b>Compartilhar > Cifra Flow</b> que entra sozinha:</p><button class="btn green" onclick="window.open('https://www.google.com/search?q='+encodeURIComponent('${q} cifra club'),' _blank')">ABRIR NO GOOGLE / CIFRA CLUB ↗️</button>`;
  }
}
async function baixarDaInternet(i,url,titulo){
  toast('Baixando: '+titulo+' ...'); document.getElementById('resultBusca').innerHTML='<p>Baixando cifra... ⏳</p>';
  try{
    let prox='https://api.allorigins.win/raw?url='+encodeURIComponent(url);
    let r=await fetch(prox); let html=await r.text();
    let cifra=extrairCifra(html,url);
    if(!cifra) throw new Error('sem cifra');
    let partes=titulo.split(' - '); let artista=partes[0]||'Internet'; let musica=partes[1]||titulo;
    // Tenta separar artista/música melhor: "Alcione - Você Me Vira a Cabeça"
    if(titulo.includes(' - ')){artista=titulo.split(' - ')[0]; musica=titulo.split(' - ').slice(1).join(' - ')}
    musicas.push({artista:artista.trim(),musica:musica.trim(),texto:cifra});
    localStorage.setItem('cf_musicas',JSON.stringify(musicas));
    toast('Baixada! ✅ '+musica);
    ir('inicio'); ver(musicas.length-1);
  }catch(e){ window.open(url,'_blank'); toast('Abri no navegador. Toca em Compartilhar > Cifra Flow'); }
}
function extrairCifra(html,url){
  let doc=new DOMParser().parseFromString(html,'text/html');
  // Cifra Club guarda em <pre>
  let pre=doc.querySelector('pre');
  if(pre && pre.textContent.trim().length>50) return pre.textContent.trim();
  // Fallback: pega texto com acordes
  let txt=doc.body.innerText||''; let linhas=txt.split('\n').filter(l=>l.trim().length>0);
  if(linhas.length>10) return linhas.slice(0,200).join('\n');
  return '';
}

// ===== COMPARTILHAR DO CIFRA CLUB / GOOGLE -> CIFRA FLOW =====
// Quando você toca Compartilhar > Cifra Flow no Chrome, ele abre aqui com ?text= ou ?url=
window.addEventListener('load',()=>{
  let p=new URLSearchParams(location.search);
  let shared=p.get('url')||p.get('text')||'';
  if(shared && shared.includes('cifraclub')){
    let urlMatch=shared.match(/https?:\/\/[^\s]+cifraclub[^\s]+/);
    let url=urlMatch?urlMatch[0]:shared;
    toast('Recebi do Cifra Club! Baixando...');
    abrirBuscaInternet();
    setTimeout(()=>baixarDaInternet(0,url,document.title||'Música do Cifra Club'),500);
  } else if(shared && shared.includes('http')){
    toast('Link recebido! Abrindo...');
    window.open(shared,'_blank');
  }
  render();
});
</script>
</body>
</html>
