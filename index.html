<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Chord Wizard</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: #fff; margin: 0; padding: 20px; }
        #viewer { max-width: 600px; margin: auto; font-size: 1.2rem; line-height: 2; }
        .chord-line { font-weight: bold; color: #00d2ff; position: relative; height: 1.5em; }
        .text-line { margin-bottom: 1em; }
        .chord { position: absolute; }
        #controls { position: fixed; bottom: 0; left: 0; width: 100%; background: #1f1f1f; padding: 15px; box-sizing: border-box; }
        .control-group { margin-bottom: 10px; }
    </style>
</head>
<body>

<div id="viewer">
    <h1 id="song-title"></h1>
    <div id="lyrics-container"></div>
</div>

<div id="controls">
    <div class="control-group">
        <label>BPM: <span id="bpm-val">124</span></label>
        <input type="range" id="bpm" min="60" max="200" value="124">
    </div>
    <div class="control-group">
        <label>Pitch (Semitons):</label>
        <input type="range" id="pitch" min="-6" max="6" value="0">
    </div>
    <button onclick="salvarConfiguracao()">Salvar Setup</button>
</div>

<script src="app.js"></script>
</body>
</html>
