<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cifra Flow</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:system-ui, sans-serif;
  color:#fff;
  min-height:100vh;
  background-color:#7a4a21;
  background-image:url('https://images.unsplash.com/photo-1520262454473-a1a82276a574?w=900&q=80&auto=format&fit=crop');
  background-size:cover;
  background-position:center;
  background-attachment:fixed;
}
header{
  display:flex;align-items:center;gap:12px;
  padding:14px 16px;
  background:rgba(0,0,0,.45);
  position:sticky;top:0;z-index:10;
}
#btnMenu{
  font-size:26px;background:#fff;color:#5a3316;
  border:0;width:44px;height:44px;border-radius:10px;cursor:pointer;
}
h1{font-size:20px}
#sidebar{
  position:fixed;top:0;left:-260px;width:250px;height:100vh;
  background:#2b1a0c;padding:20px;transition:.3s;z-index:20;
  box-shadow:4px 0 20px rgba(0,0,0,.4);
}
#sidebar.open{left:0}
#sidebar h2{margin-bottom:16px;font-size:18px}
#sidebar button{
  display:block;width:100%;text-align:left;
  background:rgba(255,255,255,.12);color:#fff;border:0;
  padding:12px;border-radius:10px;margin-bottom:10px;font-size:16px;
}
#overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.5);
  display:none;z-index:15;
}
#overlay.show{display:block}
main{padding:20px 16px 80px}
.search{
  width:100%;padding:14px;border:0;border-radius:12px;
  font-size:16px;margin-bottom:18px;outline:none;
}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{
  background:rgba(255,255,255,.92);color:#2b1a0c;
  border-radius:16px;padding:16px;min-height:110px;
}
.card b{font-size:17px;display:block;margin-bottom:6px}
.card span{font-size:13px;opacity:.7}
.add{
  position:fixed;bottom:20px;right:20px;
  width:60px;height:60px;border-radius:50%;border:0;
  background:#fff;color:#5a3316;font-size:32px;
  box-shadow:0 8px 20px rgba(0,0,0,.4);
}
</style>
</head>
<body>

<header>
  <button id="btnMenu" onclick="toggleMenu()">☰</button>
  <h1>Cifra Flow</h1>
</header>

<div id="sidebar">
  <h2>Pastas</h2>
  <button onclick="alert('Louvores')">🎵 Louvores</button>
  <button onclick="alert('Culto')">⛪ Culto</button>
  <button onclick="alert('Ensaio')">🎸 Ensaio</button>
  <button onclick="alert('Favoritas')">⭐ Favoritas</button>
  <hr style="margin:16px 0;opacity:.3">
  <button onclick="toggleMenu()">✕ Fechar</button>
</div>
<div id="overlay" onclick="toggleMenu()"></div>

<main>
  <input class="search" placeholder="🔍 Buscar cifra...">
  <div class="grid">
    <div class="card"><b>Meu Abrigo</b><span>Louvores • Tom de G</span></div>
    <div class="card"><b>Quão Grande És Tu</b><span>Culto • Tom de C</span></div>
    <div class="card"><b>Oceanos</b><span>Ensaio • Tom de D</span></div>
    <div class="card"><b>+ Nova Cifra</b><span>Clique no + para criar</span></div>
  </div>
</main>

<button class="add" onclick="alert('Criar nova cifra')">+</button>

<script>
function toggleMenu(){
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('overlay').classList.toggle('show');
}
</script>
</body>
</html>
