<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>e-Cifra - Cifra Flow</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1a6fc4">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#f0f2f5;color:#222}
header{background:#1a6fc4;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:8px 14px;gap:10px;position:sticky;top:0;z-index:10}
header b{font-size:18px}
.top{display:flex;gap:6px;flex-wrap:wrap}
.top button{background:#fff;color:#1a6fc4;border:0;padding:7px 10px;border-radius:6px;font-size:12px;font-weight:700;cursor:pointer}
.top button.blue{background:#0d4d8f;color:#fff}
.wrap{max-width:1100px;margin:0 auto;padding:14px;display:flex;gap:16px;align-items:flex-start}
.main{flex:1;background:#fff;border-radius:10px;padding:18px;box-shadow:0 2px 8px rgba(0,0,0,.08);min-width:0}
.main h1{font-size:26px}
.main small{color:#666}
.intro{margin:14px 0;color:#333;font-weight:700}
.linha{margin:22px 0;line-height:1.4}
.acorde{color:#1a6fc4;font-weight:800;display:inline-block;min-width:40px}
.letra{font-size:16px}
aside{width:260px;background:#fff;border-radius:10px;padding:14px;box-shadow:0 2px 8px rgba(0,0,0,.08);flex-shrink:0}
aside h3{font-size:14px;margin-bottom:12px;border-bottom:1px solid #eee;padding-bottom:8px}
.conf{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid #f0f0f0;font-size:13px}
.conf span{color:#666}
.pill{background:#eef4ff;color:#1a6fc4;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:700;border:0;cursor:pointer}
.pill.off{background:#eee;color:#666}
.player{margin-top:16px;background:#fff;border-radius:10px;padding:14px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.player h3{font-size:13px;margin-bottom:10px}
.prow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.prow button{background:#1a6fc4;color:#fff;border:0;padding:8px 12px;border-radius:6px;font-size:12px;font-weight:700;cursor:pointer}
.prow button.ghost{background:#eee;color:#333}
.sliders{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:12px}
.sliders label{font-size:11px;font-weight:700;color:#666;display:block;text-align:center}
.sliders input{width:100%;accent-color:#1a6fc4}
.sliders b{display:block;text-align:center;font-size:13px;margin-top:2px}
.bottom{display:flex;gap:8px;align-items:center;margin-top:14px;flex-wrap:wrap}
.bottom button{background:#eee;border:0;padding:8px 10px;border-radius:6px;font-size:12px;cursor:pointer}
.bottom select{padding:8px;border:1px solid #ddd;border-radius:6px}
#installBtn{display:none}
@media(max-width:800px){.wrap{flex-direction:column}aside{width:100%}.sliders{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>

<header>
<b>🎵 e-Cifra</b>
<div class="top">
<button onclick="document.getElementById('file').click()">⬆ IMPORTAR</button>
<button onclick="compartilhar()">↗ COMPARTILHAR</button>
<button id="installBtn">📱 INSTALAR NO CELULAR</button>
<button class="blue" onclick="alert('Saindo...')">SAIR</button>
</div>
</header>
<input type="file" id="file" hidden accept=".txt,.chordpro,.mp3,.wav">

<div class="wrap">
<div class="main">
<h1 id="titulo">Garota de Ipanema</h1>
<small>Tom Jobim & Vinicius de Moraes</small>
<p class="intro" id="intro">[Intro: F7M | G7(13) | Gm7 | C7(9)]</p>
<div id="cifra"></div>

<div class="player">
<h3>PLAYER DE ÁUDIO</h3>
<div class="prow">
<button id="btnPlay" onclick="togglePlay()">⏸ Pausar</button>
<button class="ghost" onclick="document.getElementById('file').click()">Carregar Playback/VS</button>
<button class="ghost">From um dispositivo</button>
<span style="font-size:12px;color:#666">Apoio Musical</span>
</div>
<div class="sliders">
<div><label>VOLUME</label><input type="range" id="vol" value="75" oninput="document.getElementById('vVol').innerText=this.value+'%'"><b id="vVol">75%</b></div>
<div><label>PITCH</label><input type="range" min="-6" max="6" value="0" oninput="document.getElementById('vPitch').innerText=(this.value>0?'+':'')+this.value"><b id="vPitch">0</b></div>
<div><label>REVERB</label><input type="range" value="20" oninput="document.getElementById('vRev').innerText=this.value+'%'"><b id="vRev">20%</b></div>
<div><label>GRAVE</label><input type="range" value="0" min="-10" max="10" oninput="document.getElementById('vGrave').innerText=this.value+' dB'"><b id="vGrave">0 dB</b></div>
</div>
<div class="bottom">
<button onclick="mudarBpm(-5)">- BPM</button><b><span id="bpm">76</span> BPM</b><button onclick="mudarBpm(5)">+ BPM</button>
<select id="tomSelect" onchange="mudarTom(this.value)"><option>F Maior</option><option>G Maior</option><option>C Maior</option><option>D Maior</option><option>E Maior</option></select>
<button onclick="toggleScroll()" id="btnScroll">Scroll Automático</button>
<button onclick="toggleMetro()" id="btnMetro">Metrônomo</button>
<button onclick="alert('Afinador aberto')">🎸 Tuner</button>
</div>
</div>
</div>

<aside>
<h3>CONFIGURAÇÕES</h3>
<div class="conf"><span>Tema</span><div><button class="pill" id="btnClaro" onclick="setTema('claro')">Claro</button> <button class="pill off" id="btnEscuro" onclick="setTema('escuro')">Escuro</button></div></div>
<div class="conf"><span>Tamanho da Cifra</span><b><span id="tam">16</span>px</b></div>
<div class="conf"><span>Fonte</span><span>Arial ›</span></div>
<div class="conf"><span>Transposição de Tom</span><span><button onclick="transpor(-1)">-</button> <b id="tomAtual">F</b> <button onclick="transpor(1)">+</button></span></div>
<div class="conf"><span>Rolagem Automática</span><button class="pill off" id="btnAuto" onclick="toggleScroll()">Desligada</button></div>
<div style="margin-top:14px;display:flex;gap:6px">
<button style="flex:1;background:#1a6fc4;color:#fff;border:0;padding:10px;border-radius:6px" onclick="aumentarFonte()">A+ Aumentar</button>
<button style="flex:1;background:#eee;border:0;padding:10px;border-radius:6px" onclick="diminuirFonte()">A- Diminuir</button>
</div>
</aside>
</div>

<script>
const tons=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
let tomIdx=5, fontSize=16, playing=true, scrollOn=false, scrollId=null, metroOn=false;
const dados=[
{ac:'F7M',txt:'Olha que coisa mais '},{ac:'G7(13)',txt:'linda, mais cheia de '},{ac:'Gm7',txt:'graça'},
{ac:'F7M',txt:'É ela menina que '},{ac:'Gb7(13)',txt:'vem e que passa'},
{ac:'Gm7',txt:'num doce balanço a '},{ac:'C7(9)',txt:'caminho do '},{ac:'F7M',txt:'mar'}
];
function render(){
 document.getElementById('tomAtual').innerText=tons[tomIdx];
 let html='';
 dados.forEach(d=>{
   let acorde=transporAcorde(d.ac);
   html+=`<div class="linha"><div class="acorde" style="font-size:${fontSize}px">${acorde}</div><div class="letra" style="font-size:${fontSize}px">${d.txt}</div></div>`;
 });
 document.getElementById('cifra').innerHTML=html;
}
function transporAcorde(ac){
 const raiz=ac.match(/^[A-G][#b]?/)[0];
 const idx=tons.indexOf(raiz.replace('b',''));
 let novoIdx=(idx+ (tomIdx-5) + 12)%12;
 return ac.replace(raiz, tons[novoIdx]);
}
function transpor(d){ tomIdx=(tomIdx+d+12)%12; render(); }
function mudarTom(v){ let t=v.split(' ')[0]; tomIdx=tons.indexOf(t); render(); }
function aumentarFonte(){ fontSize+=2; document.getElementById('tam').innerText=fontSize; render(); }
function diminuirFonte(){ fontSize=Math.max(12,fontSize-2); document.getElementById('tam').innerText=fontSize; render(); }
function setTema(t){
 if(t==='escuro'){ document.body.style.background='#111'; document.querySelectorAll('.main,aside,.player').forEach(e=>{e.style.background='#222';e.style.color='#fff'}); document.getElementById('btnEscuro').classList.remove('off'); document.getElementById('btnClaro').classList.add('off'); }
 else{ location.reload(); }
}
function togglePlay(){ playing=!playing; document.getElementById('btnPlay').innerText=playing?'⏸ Pausar':'▶ Tocar'; }
function toggleScroll(){
 scrollOn=!scrollOn;
 document.getElementById('btnAuto').innerText=scrollOn?'Ligada':'Desligada';
 document.getElementById('btnAuto').classList.toggle('off',!scrollOn);
 document.getElementById('btnScroll').innerText=scrollOn?'⏸ Parar Scroll':'Scroll Automático';
 if(scrollOn) scrollId=setInterval(()=>window.scrollBy(0,1),50); else clearInterval(scrollId);
}
function toggleMetro(){ metroOn=!metroOn; document.getElementById('btnMetro').innerText=metroOn?'🔊 Metrônomo ON':'Metrônomo'; alert(metroOn?'Metrônomo ligado em '+document.getElementById('bpm').innerText+' BPM':'Metrônomo desligado'); }
function mudarBpm(d){ let b=parseInt(document.getElementById('bpm').innerText)+d; document.getElementById('bpm').innerText=b; }
function compartilhar(){ if(navigator.share) navigator.share({title:'e-Cifra',text:'Garota de Ipanema',url:location.href}); else alert(location.href); }
render();
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
let dp; const ib=document.getElementById('installBtn');
window.addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); dp=e; ib.style.display='block'; ib.onclick=()=>{ ib.style.display='none'; dp.prompt(); }; });
</script>
</body>
</html>
