<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cifra Flow - Chord Wizard</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1a6fc4">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:sans-serif;background:#121212;color:#fff;padding:20px}
.app{max-width:900px;margin:auto;background:#1a1a1a;border:2px solid #1a6fc4;border-radius:10px;overflow:hidden}
header{background:#1a6fc4;color:#fff;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:8px}
header button{background:#fff;border:0;padding:8px 12px;border-radius:6px;font-weight:700;cursor:pointer}
.home{padding:14px}
.busca{width:100%;padding:12px;border:1px solid #333;border-radius:10px;margin-bottom:12px;background:#222;color:#fff}
.controles{background:#1f1f1f;border:1px solid #333;border-radius:12px;padding:12px;margin-bottom:14px;display:flex;gap:14px;flex-wrap:wrap}
.controles label{font-size:11px;font-weight:700;color:#aaa;display:block}
.controles input{width:100%}
.controles div{flex:1;min-width:120px}
/* PASTA DE ARQUIVO REALISTA */
.pastas{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.pasta{cursor:pointer;text-align:center;padding:6px}
.pasta-icone{position:relative;width:100%;height:72px;margin-bottom:6px}
.pasta-aba{position:absolute;top:0;left:0;width:38%;height:18px;background:#f7c948;border-radius:8px 8px 0 0}
.pasta-corpo{position:absolute;top:12px;left:0;right:0;bottom:0;background:linear-gradient(#ffd95e,#f7c948);border-radius:6px 10px 10px 10px;box-shadow:0 4px 10px rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center}
.pasta-corpo b{font-size:22px;color:#5a3d00}
.pasta.aberta .pasta-corpo{background:linear-gradient(#ffe680,#ffcc00)}
.pasta b.nome{display:block;font-size:14px}
.pasta small{color:#aaa;font-size:12px}
.musicas-dentro{grid-column:1/-1;display:none;flex-direction:column;gap:8px;background:#222;border:1px solid #333;border-radius:12px;padding:10px;margin-top:-6px}
.pasta.aberta + .musicas-dentro{display:flex}
.musica-item{background:#1a1a1a;border:1px solid #333;border-radius:10px;padding:12px;display:flex;justify-content:space-between;cursor:pointer}
.btns{display:flex;gap:8px;margin:12px 0}
.btns button{flex:1;padding:12px;border-radius:10px;font-weight:700;cursor:pointer}
.btnAdd{background:#1a6fc4;color:#fff;border:0}
.btnEdit{background:#222;color:#00d2ff;border:1px solid #1a6fc4}
#viewer{max-width:600px;margin:auto;font-size:1.2rem;line-height:2;padding:14px;display:none}
#viewer.mostrar{display:block}
.chord-line{font-weight:bold;color:#00d2ff;position:relative;height:1.5em;white-space:nowrap}
.text-line{margin-bottom:1em;white-space:nowrap}
.chord{position:absolute}
.btnReverb{padding:8px 12px;border-radius:8px;border:1px solid #1a6fc4;background:#222;color:#00d2ff;font-weight:700;cursor:pointer}
.btnReverb.on{background:#1a6fc4;color:#fff}
.btnVoltar{background:#222;color:#fff;border:1px solid #333;padding:10px 14px;border-radius:8px;font-weight:700;cursor:pointer;margin-bottom:12px}
.btnSimplificada{padding:10px 14px;border-radius:8px;border:1px solid #1a6fc4;background:#222;color:#00d2ff;font-weight:700;cursor:pointer;margin-bottom:12px}
.btnSimplificada.on{background:#1a6fc4;color:#fff}
#menuFundo{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:90;display:none}
#menuFundo.show{display:block}
#menuLateral{position:fixed;top:0;left:0;bottom:0;width:280px;max-width:85vw;background:#1a1a1a;border-right:2px solid #1a6fc4;z-index:100;padding:16px;overflow-y:auto;transform:translateX(-100%);transition:.25s}
#menuLateral.show{transform:translateX(0)}
.menuSecao{font-size:11px;font-weight:700;color:#888;margin:16px 0 8px}
.menuItem{background:#222;border:1px solid #333;border-radius:10px;padding:12px;margin-bottom:8px;display:flex;justify-content:space-between;cursor:pointer}
.menuItem.ativo{border-color:#1a6fc4;background:#1a6fc4}
.menuBtn{width:100%;padding:12px;border-radius:10px;font-weight:700;cursor:pointer;border:0;margin-bottom:8px}
/* TELA GRANDE LIMPA - BOTÕES IGUAIS */
#telaCheia{position:fixed;inset:0;background:#121212;z-index:200;display:none;overflow-y:auto;padding:16px}
#telaCheia.show{display:block}
.barra-limpa{position:sticky;top:0;background:#121212;padding:8px 0 12px;display:flex;flex-direction:column;gap:8px}
.linha-botoes{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.linha-botoes span{font-size:11px;font-weight:700;color:#aaa;min-width:52px}
.linha-botoes button{background:#222;border:1px solid #333;color:#fff;padding:8px 11px;border-radius:20px;font-weight:700;cursor:pointer;min-width:36px}
.linha-botoes button.ativo{background:#1a6fc4;border-color:#1a6fc4;color:#fff}
.linha-botoes button.btnRolar{background:#1a6fc4;border-color:#1a6fc4}
.btnSair{background:#1a6fc4!important;color:#fff!important;border:0;padding:8px 14px;border-radius:20px;font-weight:700;cursor:pointer;margin-left:auto}
#lyrics-cheia{white-space:nowrap;overflow-x:auto}
</style>
</head>
<body>
<div class="app">
<header>
<button onclick="abrirMenu()">☰ MENU</button>
<b>🎵 Cifra Flow</b>
<button onclick="abrirTelaCheia()">⛶ TELA GRANDE</button>
</header>
<div class="home">
<input class="busca" id="busca" placeholder="🔍 Buscar cantor ou música..." oninput="filtrar()">
<div class="controles">
<div><label>VOLUME</label><input type="range" id="volume" value="75"><span id="volume-val">75%</span></div>
<div><label>PITCH: <span id="pitch-val">0 st</span></label><input type="range" id="pitch" min="-6" max="6" value="0"></div>
<div><label>BPM: <span id="bpm-val">124</span></label><input type="range" id="bpm" min="60" max="200" value="124"></div>
<div><label>GRAVE</label><input type="range" id="bass" min="-10" max="10" value="0"><span id="bass-val">0 dB</span></div>
<div><label>AGUDO</label><input type="range" id="treble" min="-10" max="10" value="0"><span id="treble-val">0 dB</span></div>
<div><label>REVERB</label><br><button id="reverbBtn" class="btnReverb on" onclick="toggleReverb()">REVERB: LIGADO</button></div>
</div>
<h3 style="margin-bottom:12px" id="tituloSecao">Pastas dos Cantores</h3>
<div class="pastas" id="lista-pastas"></div>
<div class="btns"><button class="btnAdd" onclick="adicionarCifra()">+ Adicionar Nova Cifra</button><button class="btnEdit" onclick="editarCifra()">✏️ Editar</button></div>
<div id="viewer">
<button class="btnVoltar" onclick="voltarPastas()">← Voltar para Pastas</button>
<h1 id="song-title"></h1>
<p id="song-artist" style="color:#aaa;margin-bottom:12px"></p>
<div style="display:flex;gap:8px;flex-wrap:wrap">
<button class="btnSimplificada" id="btnSimp" onclick="toggleSimplificada()">🎸 CIFRA SIMPLIFICADA: DESLIGADA</button>
<button class="btnSimplificada" onclick="mudarTom(-1)">TOM -</button>
<button class="btnSimplificada" onclick="mudarTom(1)">TOM +</button>
<span id="tomAtual" style="align-self:center;font-weight:700;color:#00d2ff">Tom: Original</span>
</div>
<div id="lyrics-container"></div>
<button onclick="salvarConfiguracao()" style="background:#1a6fc4;color:#fff;border:0;padding:12px 18px;border-radius:10px;font-weight:700;cursor:pointer;margin-top:10px">💾 Salvar Setup</button>
</div>
</div>
</div>
<div id="menuFundo" onclick="fecharMenu()"></div>
<div id="menuLateral">
<h2 style="color:#00d2ff">🎵 Cifra Flow</h2>
<p style="color:#aaa;font-size:13px;margin-bottom:10px">Taki Artesanal • Seu repertório</p>
<button onclick="fecharMenu()" style="background:#222;color:#fff;border:1px solid #333;padding:8px 12px;border-radius:8px;cursor:pointer;margin-bottom:10px">✕ Fechar</button>
<div class="menuSecao">MINHAS CIFRAS</div>
<div class="menuItem" onclick="irPara('vs')" id="menu-vs"><div><b>🎹 Com VS</b><br><small id="count-vs">0 cifras</small></div><span>›</span></div>
<div class="menuItem" onclick="irPara('playback')" id="menu-playback"><div><b>▶️ Com Playback</b><br><small id="count-playback">0 cifras</small></div><span>›</span></div>
<div class="menuItem" onclick="irPara('todas')" id="menu-todas"><div><b>📚 Biblioteca</b><br><small id="count-todas">Tudo que você baixar ou criar</small></div><span>›</span></div>
<div class="menuSecao">APP</div>
<button class="menuBtn" style="background:#00c853;color:#fff" onclick="instalarApp()">📲 INSTALAR APLICATIVO</button>
<button class="menuBtn" style="background:#fff;color:#1a6fc4" onclick="compartilharApp()">🔗 COMPARTILHAR</button>
<div class="menuSecao">BACKUP</div>
<button class="menuBtn" style="background:#1a6fc4;color:#fff" onclick="exportarDados()">⬆️ EXPORTAR</button>
<button class="menuBtn" style="background:#222;color:#00d2ff;border:1px solid #1a6fc4" onclick="document.getElementById('inputImportar').click()">⬇️ IMPORTAR</button>
<input type="file" id="inputImportar" accept=".json" style="display:none" onchange="importarDados(event)">
<div class="menuSecao">OUTROS</div>
<div class="menuItem" onclick="abrirTelaCheia();fecharMenu()"><div><b>⛶ Tela Grande</b><br><small>Só letra + cifra</small></div><span>›</span></div>
</div>
<div id="telaCheia">
<div class="barra-limpa">
<div class="linha-botoes"><span>ROLAGEM</span><button onclick="setRolagem(1)" id="r1">1</button><button onclick="setRolagem(2)" id="r2">2</button><button onclick="setRolagem(3)" id="r3">3</button><button onclick="setRolagem(4)" id="r4">4</button><button onclick="setRolagem(5)" id="r5">5</button><button onclick="setRolagem(6)" id="r6">6</button><button onclick="setRolagem(7)" id="r7">7</button><button class="btnRolar" onclick="toggleRolagem()" id="btnRolar">▶ Rolar</button><button class="btnSair" onclick="fecharTelaCheia()">✕ SAIR</button></div>
<div class="linha-botoes"><span>TOM</span><button onclick="mudarTom(-1)">- Tom</button><button id="tomCheia" style="min-width:80px">Original</button><button onclick="mudarTom(1)">+ Tom</button><button onclick="toggleSimplificada()" id="btnSimpCheia">🎸 Simplificada</button></div>
<div class="linha-botoes"><span>LETRA</span><button onclick="mudarFonte(-2)">A-</button><button onclick="mudarFonte(2)">A+</button></div>
</div>
<h1 id="tituloCheia"></h1>
<p id="artistaCheia" style="color:#aaa"></p>
<div id="lyrics-cheia" style="font-size:20px;line-height:2"></div>
</div>
<script src="app.js"></script>
</body>
</html>
