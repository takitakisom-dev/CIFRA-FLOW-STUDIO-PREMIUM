<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cifra Flow - Chord Wizard</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:sans-serif;background:#121212;color:#fff;padding:20px}
.app{max-width:900px;margin:auto;background:#1a1a1a;border:2px solid #1a6fc4;border-radius:10px;overflow:hidden}
header{background:#1a6fc4;color:#fff;padding:12px 14px;display:flex;justify-content:space-between;align-items:center}
.home{padding:14px}
.busca{width:100%;padding:12px;border:1px solid #333;border-radius:10px;margin-bottom:12px;background:#222;color:#fff}
.controles{background:#1f1f1f;border:1px solid #333;border-radius:12px;padding:12px;margin-bottom:14px;display:flex;gap:14px;flex-wrap:wrap}
.controles label{font-size:11px;font-weight:700;color:#aaa;display:block}
.controles input{width:100%}
.controles div{flex:1;min-width:120px}
.pastas{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.pasta{background:#222;border:1px solid #333;border-radius:12px;padding:13px;display:flex;justify-content:space-between;cursor:pointer}
.btns{display:flex;gap:8px;margin:12px 0}
.btns button{flex:1;padding:12px;border-radius:10px;font-weight:700;cursor:pointer}
.btnAdd{background:#1a6fc4;color:#fff;border:0}
.btnEdit{background:#222;color:#00d2ff;border:1px solid #1a6fc4}
#viewer{max-width:600px;margin:auto;font-size:1.2rem;line-height:2;padding:14px}
.chord-line{font-weight:bold;color:#00d2ff;position:relative;height:1.5em}
.text-line{margin-bottom:1em}
.chord{position:absolute}
.btnReverb{padding:8px 12px;border-radius:8px;border:1px solid #1a6fc4;background:#222;color:#00d2ff;font-weight:700;cursor:pointer}
.btnReverb.on{background:#1a6fc4;color:#fff}
#telaCheia{position:fixed;inset:0;background:#121212;z-index:100;display:none;overflow-y:auto;padding:20px}
#telaCheia.show{display:block}
#telaCheia .barra{position:sticky;top:0;background:#121212;padding:10px 0;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
#telaCheia .barra button{background:#1f1f1f;border:1px solid #1a6fc4;color:#00d2ff;padding:7px 10px;border-radius:8px;font-weight:700;cursor:pointer}
#telaCheia .barra button.ativo{background:#1a6fc4;color:#fff}
.btnSair{background:#1a6fc4!important;color:#fff!important;margin-left:auto}
</style>
</head>
<body>
<div class="app">
<header><b>🎵 Cifra Flow</b><button onclick="abrirTelaCheia()" style="background:#fff;border:0;padding:7px 11px;border-radius:6px;font-weight:700;cursor:pointer">⛶ TELA GRANDE</button></header>
<div class="home">
<input class="busca" placeholder="🔍 Buscar cantor ou música...">
<div class="controles">
<div><label>VOLUME</label><input type="range" id="volume" value="75"><span id="volume-val">75%</span></div>
<div><label>PITCH (Semitons): <span id="pitch-val">0 st</span></label><input type="range" id="pitch" min="-6" max="6" value="0"></div>
<div><label>BPM: <span id="bpm-val">124</span></label><input type="range" id="bpm" min="60" max="200" value="124"></div>
<div><label>GRAVE (BASS)</label><input type="range" id="bass" min="-10" max="10" value="0"><span id="bass-val">0 dB</span></div>
<div><label>AGUDO (TREBLE)</label><input type="range" id="treble" min="-10" max="10" value="0"><span id="treble-val">0 dB</span></div>
<div><label>REVERB</label><br><button id="reverbBtn" class="btnReverb on" onclick="toggleReverb()">REVERB: LIGADO</button></div>
</div>
<h3 style="margin-bottom:10px">Pastas dos Cantores</h3>
<div class="pastas">
<div class="pasta"><div><b>🎤 Jorge Ben Jor</b><br><span>1 música</span></div><span>›</span></div>
<div class="pasta"><div><b>🎤 Caetano Veloso</b><br><span>2 músicas</span></div><span>›</span></div>
<div class="pasta"><div><b>🎸 Legião Urbana</b><br><span>2 músicas</span></div><span>›</span></div>
</div>
<div class="btns"><button class="btnAdd" onclick="adicionarCifra()">+ Adicionar Nova Cifra</button><button class="btnEdit" onclick="editarCifra()">✏️ Editar</button></div>
<div id="viewer">
<h1 id="song-title"></h1>
<p id="song-artist" style="color:#aaa;margin-bottom:12px"></p>
<div id="lyrics-container"></div>
<button onclick="salvarConfiguracao()" style="background:#1a6fc4;color:#fff;border:0;padding:12px 18px;border-radius:10px;font-weight:700;cursor:pointer;margin-top:10px">💾 Salvar Setup</button>
</div>
</div>
</div>
<div id="telaCheia">
<div class="barra">
<span style="font-size:12px;font-weight:700">ROLAGEM:</span>
<button onclick="setRolagem(1)" id="r1">1 Devagar</button><button onclick="setRolagem(2)" id="r2">2</button><button onclick="setRolagem(3)" id="r3">3</button><button onclick="setRolagem(4)" id="r4">4</button><button onclick="setRolagem(5)" id="r5">5</button><button onclick="setRolagem(6)" id="r6">6</button><button onclick="setRolagem(7)" id="r7">7 Rápido</button>
<button onclick="toggleRolagem()" id="btnRolar">▶ Rolar</button>
<span style="font-size:12px;font-weight:700">LETRA:</span><button onclick="mudarFonte(-2)">A-</button><button onclick="mudarFonte(2)">A+</button>
<button class="btnSair" onclick="fecharTelaCheia()">✕ SAIR</button>
</div>
<h1 id="tituloCheia"></h1>
<p id="artistaCheia" style="color:#aaa"></p>
<div id="lyrics-cheia" style="font-size:20px;line-height:2"></div>
</div>
<script src="app.js"></script>
</body>
</html>
