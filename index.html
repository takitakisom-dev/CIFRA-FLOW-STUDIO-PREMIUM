<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Cifra Flow</title>
<link rel="manifest" href="manifest.json">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#E8DDC8}
.phone{max-width:480px;margin:0 auto;height:100dvh;position:relative;overflow:hidden}
.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.btn{position:absolute;background:transparent;border:none;cursor:pointer}
.btn:active{background:rgba(255,255,255,.2);border-radius:12px}
/* BOTÕES INVISÍVEIS EM CIMA DA FOTO */
#todos{top:29%;left:57%;width:38%;height:9%}
#alcione{top:41%;left:57%;width:38%;height:9%}
#capital{top:53%;left:57%;width:38%;height:9%}
#cazuza{top:65%;left:57%;width:38%;height:9%}
#cidade{top:77%;left:57%;width:38%;height:9%}
#claudio{top:89%;left:57%;width:38%;height:9%}
#vs{top:27%;left:4%;width:46%;height:6%}
#playback{top:35%;left:4%;width:46%;height:7%}
#cifras{top:44%;left:4%;width:46%;height:6%}
#listas{top:51%;left:4%;width:46%;height:6%}
.cifra{display:none;position:absolute;inset:0;background:#FFF8EA;z-index:20;overflow-y:auto;padding:16px;font-family:Arial,sans-serif}
.cifra.show{display:block}
.cifra h2{font-size:24px;text-align:center}
.cifra p{text-align:center;color:#666;font-size:13px;margin:6px 0 14px}
.tools{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:16px}
.tools button{background:#fff;border:1px solid #ddd;padding:9px 14px;border-radius:20px;font-weight:700}
.tools button.dark{background:#6B4226;color:#fff}
.bloco{margin-bottom:16px;background:#fff;padding:14px;border-radius:14px}
.chord{font-size:19px;font-weight:800}
.lyric{font-size:22px;font-weight:800;margin-top:4px}
.small{font-size:14px;margin-top:6px}
.back{width:100%;padding:12px;border:none;background:#eee;border-radius:12px;font-weight:700;margin-top:10px}
.full{position:fixed;inset:0;background:#000;color:#fff;z-index:50;display:none;padding:50px 26px}
.full.show{display:block}
.full .big{font-size:32px;font-weight:800;line-height:1.35;margin-bottom:24px}
.full .small2{font-size:19px;opacity:.75;margin-bottom:24px}
</style>
</head>
<body>
<div class="phone">
  <img class="bg" src="fundo.jpg">

  <button class="btn" id="todos" onclick="openSong('Todos')"></button>
  <button class="btn" id="alcione" onclick="openSong('Alcione')"></button>
  <button class="btn" id="capital" onclick="openSong('Primeiros Erros')"></button>
  <button class="btn" id="cazuza" onclick="openSong('Cazuza')"></button>
  <button class="btn" id="cidade" onclick="openSong('Cidade Negra')"></button>
  <button class="btn" id="claudio" onclick="openSong('Claudio Zoli')"></button>

  <button class="btn" id="vs" onclick="alert('Minhas Cifras com VS')"></button>
  <button class="btn" id="playback" onclick="alert('Playback')"></button>
  <button class="btn" id="cifras" onclick="alert('Minhas Cifras')"></button>
  <button class="btn" id="listas" onclick="alert('Minhas Listas')"></button>

  <div class="cifra" id="cifra">
    <h2 id="tMusica">Primeiros Erros</h2>
    <p>Capital Inicial • Tom: Em • BPM 98</p>
    <div class="tools"><button>Tom: Em ▼</button><button>Rolagem ▶</button><button class="dark" onclick="document.getElementById('full').classList.add('show')">Tela Cheia ⛶</button><button>VS VS</button></div>
    <div class="bloco"><div class="chord">Em &nbsp; C &nbsp; G &nbsp; D</div><div class="lyric">Foram &nbsp; errei &nbsp; Tentei &nbsp; que</div><div class="small">foram tantos erros, eu só queria acertar</div></div>
    <div class="bloco"><div class="chord">Em &nbsp; C</div><div class="lyric">Foram &nbsp; errei</div><div class="small">foram tantos erros, eu sei que eu errei demais</div></div>
    <button class="back" onclick="document.getElementById('cifra').classList.remove('show')">← Voltar</button>
  </div>

  <div class="full" id="full" onclick="this.classList.remove('show')">
    <div class="big">Foram errei<br>Tentei que</div><div class="small2">foram tantos erros, eu só queria acertar</div>
    <p style="opacity:.4;font-size:12px;text-align:center;margin-top:40px">Toque para sair</p>
  </div>
</div>
<script>
function openSong(n){document.getElementById('tMusica').innerText=n;document.getElementById('cifra').classList.add('show')}
</script>
</body>
</html>
